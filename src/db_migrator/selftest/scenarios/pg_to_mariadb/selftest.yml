compose_file: ../../docker-compose.yml
docker:
  source:
    dbms: postgresql
    image: postgres:16
    host_port: 15432
    container_port: 5432
    database: source
    schema: public
    user: source_user
    password: source_pass
    healthcheck: pg_isready -U source_user -d source
    container_environment:
      POSTGRES_DB: source
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_pass
  target:
    dbms: mariadb
    image: mariadb:11
    host_port: 13306
    container_port: 3306
    database: target
    user: target_user
    password: target_pass
    root_password: root_pass
    environment: local
    healthcheck: mariadb-admin ping -h 127.0.0.1 -u root -proot_pass --silent
    container_environment:
      MARIADB_DATABASE: target
      MARIADB_USER: target_user
      MARIADB_PASSWORD: target_pass
      MARIADB_ROOT_PASSWORD: root_pass
source_seed:
  service: source
  schema_file: source/postgresql/schema.sql
  seed_file: source/postgresql/seed.sql
  schema_command:
    - psql
    - -U
    - source_user
    - -d
    - source
    - -v
    - ON_ERROR_STOP=1
    - -f
    - "{script_path}"
  seed_command:
    - psql
    - -U
    - source_user
    - -d
    - source
    - -v
    - ON_ERROR_STOP=1
    - -v
    - "large_rows={large_rows}"
    - -f
    - "{script_path}"
migration_config:
  job:
    name: self-test-pg-to-mariadb
  migration:
    existing_table_policy: skip
    apply_foreign_keys: true
    batch_size: 5000
    large_row_batch_size: 500
    commit_interval: 5000
    parallel_table_count: 1
    throttle_sleep_ms: 0
  safety:
    is_production_protection: true
    allow_destructive_on_production: false
    require_dry_run_before_destructive: true
  report:
    output_dir: .tmp/selftest/reports
  verification:
    row_count: true
    checksum_sample: true
    checksum_sample_size: 200
    checksum_datetime_precision: microseconds
    checksum_timezone: UTC
    checksum_float_precision: 12
